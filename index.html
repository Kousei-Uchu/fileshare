<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Video Compressor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, sans-serif; background: #111; color: #eee;
  }
  main {
    width: min(760px, calc(100% - 24px)); padding: 22px; margin: 12px 0;
    background: #1b1b1b; border: 1px solid #333; border-radius: 16px;
  }
  h1 { margin-top: 0; font-size: 1.4rem; }
  .drop {
    display: block; padding: 36px 20px; text-align: center;
    border: 2px dashed #555; border-radius: 12px; cursor: pointer;
  }
  .drop:hover { border-color: #aaa; }
  input[type=file] { display: none; }
  button, a.button {
    display: inline-block; margin: 16px 8px 0 0; padding: 12px 18px;
    border: 0; border-radius: 9px; background: #eee; color: #111;
    font: inherit; cursor: pointer; text-decoration: none;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status { margin-top: 18px; white-space: pre-wrap; }
  progress { width: 100%; height: 14px; margin-top: 12px; }
  .info { color: #aaa; font-size: .9rem; line-height: 1.5; }
  .queue { margin-top: 22px; display: grid; gap: 8px; }
  .item { padding: 12px 14px; border: 1px solid #333; border-radius: 10px; background: #151515; }
  .item-header { display: flex; justify-content: space-between; gap: 12px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-status { color: #aaa; font-size: .85rem; margin-top: 5px; word-break: break-word; }
  .item a { color: inherit; }
  .stats { margin-top: 16px; color: #aaa; font-size: .9rem; }
  .err { color: #f88; }
  label.opt { display: block; margin-top: 16px; }
  select { font: inherit; padding: 6px; background: #151515; color: #eee; border: 1px solid #444; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Local Video Compressor</h1>

  <p class="info">
    Compresses videos on-device using your browser's hardware video encoder (WebCodecs),
    so it's many times faster than software FFmpeg. Output is never below a 1080p canvas.
    Keep this tab open and in the foreground while it runs.
  </p>

  <label class="drop" for="files">
    <strong>Choose videos</strong><br>
    <span class="info">You can select multiple files at once</span>
  </label>
  <input id="files" type="file" accept="video/*" multiple>

  <label class="opt info">
    Quality:
    <select id="quality">
      <option value="4000000">Smaller (~4 Mbps)</option>
      <option value="6000000" selected>Balanced (~6 Mbps)</option>
      <option value="9000000">Higher (~9 Mbps)</option>
    </select>
  </label>

  <div>
    <button id="compress" disabled>Compress all</button>
    <button id="clear" disabled>Clear queue</button>
    <a id="downloadAll" class="button" hidden>Download all (.zip)</a>
  </div>

  <div id="queue" class="queue"></div>
  <progress id="progress" value="0" max="1" hidden></progress>
  <div id="status"></div>
  <div id="stats" class="stats"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script type="module">
import {
  Input, Output, Conversion, ALL_FORMATS, BlobSource, Mp4OutputFormat, BufferTarget
} from "https://cdn.jsdelivr.net/npm/mediabunny@1/+esm";

const fileInput = document.getElementById("files");
const qualitySelect = document.getElementById("quality");
const compressButton = document.getElementById("compress");
const clearButton = document.getElementById("clear");
const downloadAll = document.getElementById("downloadAll");
const queueElement = document.getElementById("queue");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const stats = document.getElementById("stats");

let files = [];
let results = [];
let processing = false;
let wakeLock = null;

if (!("VideoEncoder" in window)) {
  status.innerHTML = '<span class="err">This browser has no WebCodecs support (needs Chrome/Edge/Safari 16.4+/recent Firefox).</span>';
}

fileInput.addEventListener("change", () => {
  if (!fileInput.files.length) return;
  for (const item of files) if (item.outputURL) URL.revokeObjectURL(item.outputURL);

  files = Array.from(fileInput.files).map((file, index) => ({
    file, index, status: "waiting", output: null, outputURL: null, error: null
  }));
  results = [];
  downloadAll.hidden = true;
  renderQueue();
  updateButtons();
});

clearButton.addEventListener("click", () => {
  if (processing) return;
  for (const item of files) if (item.outputURL) URL.revokeObjectURL(item.outputURL);
  files = [];
  results = [];
  fileInput.value = "";
  queueElement.innerHTML = "";
  status.textContent = "";
  stats.textContent = "";
  downloadAll.hidden = true;
  progress.hidden = true;
  updateButtons();
});

compressButton.addEventListener("click", compressAll);

async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
}
function releaseAwake() {
  try { wakeLock && wakeLock.release(); } catch {}
  wakeLock = null;
}
document.addEventListener("visibilitychange", () => {
  if (processing && document.visibilityState === "visible") keepAwake();
});

async function compressAll() {
  if (!files.length || processing) return;

  processing = true;
  compressButton.disabled = true;
  clearButton.disabled = true;
  downloadAll.hidden = true;
  progress.hidden = false;
  progress.value = 0;
  results = [];
  await keepAwake();

  try {
    for (const item of files) {
      item.status = "processing";
      item.error = null;
      renderQueue();
      try {
        await compressOne(item);
      } catch (error) {
        console.error(error);
        item.status = "failed";
        item.error = error?.message || String(error);
      }
      renderQueue();
    }

    const successful = files.filter(x => x.output);
    if (successful.length) {
      downloadAll.hidden = false;
      status.textContent =
        `Finished ${successful.length} of ${files.length} video${files.length === 1 ? "" : "s"}.`;
    } else {
      status.textContent = "No videos were successfully compressed.";
    }
    updateStats();
  } finally {
    processing = false;
    progress.hidden = true;
    releaseAwake();
    updateButtons();
  }
}

async function compressOne(item) {
  const input = new Input({ source: new BlobSource(item.file), formats: ALL_FORMATS });

  try {
    const track = await input.getPrimaryVideoTrack();
    if (!track) throw new Error("No video track found");

    // 1080p floor: landscape -> 1920x1080, portrait/square -> 1080x1920.
    // Aspect ratio preserved; padded with black ("contain").
    const landscape = track.displayWidth > track.displayHeight;
    const width = landscape ? 1920 : 1080;
    const height = landscape ? 1080 : 1920;

    const output = new Output({
      format: new Mp4OutputFormat({ fastStart: "in-memory" }),
      target: new BufferTarget()
    });

    const conversion = await Conversion.init({
      input,
      output,
      video: {
        width,
        height,
        fit: "contain",
        codec: "avc",
        bitrate: Number(qualitySelect.value),
        hardwareAcceleration: "prefer-hardware"
      }
      // Audio is left alone: AAC is copied as-is, anything else is transcoded automatically.
    });

    if (!conversion.isValid) {
      throw new Error("Can't convert this file in this browser (unsupported codec).");
    }

    conversion.onProgress = (p) => {
      progress.value = p;
      status.textContent = `Compressing ${item.file.name}… ${Math.round(p * 100)}%`;
    };

    await conversion.execute();

    const blob = new Blob([output.target.buffer], { type: "video/mp4" });
    item.output = blob;
    item.outputURL = URL.createObjectURL(blob);
    item.status = "done";
    results.push({ name: makeOutputName(item.file.name), blob });
  } finally {
    try { input.dispose?.(); } catch {}
  }
}

async function downloadAllAsZip() {
  if (!results.length) return;
  downloadAll.textContent = "Building ZIP…";
  downloadAll.style.pointerEvents = "none";
  try {
    const zip = new JSZip();
    for (const r of results) zip.file(r.name, r.blob);
    const blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "compressed-videos.zip";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } finally {
    downloadAll.textContent = "Download all (.zip)";
    downloadAll.style.pointerEvents = "";
  }
}
downloadAll.addEventListener("click", downloadAllAsZip);

function renderQueue() {
  queueElement.innerHTML = "";

  for (const item of files) {
    const row = document.createElement("div");
    row.className = "item";
    const sizeMB = item.file.size / 1024 / 1024;

    let statusText = "Waiting";
    if (item.status === "processing") statusText = "Compressing…";
    if (item.status === "failed") statusText = `Failed: ${item.error}`;
    if (item.status === "done") {
      const outputMB = item.output.size / 1024 / 1024;
      const reduction = (1 - item.output.size / item.file.size) * 100;
      statusText =
        `${outputMB.toFixed(1)} MB — ` +
        (reduction >= 0 ? `${reduction.toFixed(1)}% smaller` : `${Math.abs(reduction).toFixed(1)}% larger`);
    }

    row.innerHTML = `
      <div class="item-header">
        <span class="name">${escapeHTML(item.file.name)}</span>
        <span>${sizeMB.toFixed(1)} MB</span>
      </div>
      <div class="item-status">${escapeHTML(statusText)}</div>
    `;

    if (item.status === "done") {
      const link = document.createElement("a");
      link.href = item.outputURL;
      link.download = makeOutputName(item.file.name);
      link.textContent = "Download";
      link.style.marginLeft = "10px";
      row.querySelector(".item-status").appendChild(link);
    }
    queueElement.appendChild(row);
  }
  updateStats();
}

function updateStats() {
  const total = files.length;
  const done = files.filter(x => x.status === "done").length;
  const failed = files.filter(x => x.status === "failed").length;
  stats.textContent = total ? `${done}/${total} complete${failed ? ` · ${failed} failed` : ""}` : "";
}

function updateButtons() {
  compressButton.disabled = !files.length || processing;
  clearButton.disabled = !files.length || processing;
}

function makeOutputName(name) {
  return `${name.replace(/\.[^.]+$/, "")}-compressed.mp4`;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[c]));
}
</script>
</body>
</html>
